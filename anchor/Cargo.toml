[workspace]
members = ["programs/*"]
resolver = "2"

[patch.crates-io]
libsecp256k1-gen-ecmult = { path = "patches/libsecp256k1-gen-ecmult" }
libsecp256k1-gen-genmult = { path = "patches/libsecp256k1-gen-genmult" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
